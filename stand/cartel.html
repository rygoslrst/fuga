<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUGA — cartel del stand</title>
<style>
  /* Cartel para imprimir en A4. Fondo blanco a propósito: gasta poca tinta en
     la impresora del colegio y el QR se lee mejor con máximo contraste. */
  @font-face { font-family: 'Anton'; src: url('../fuentes/anton-latin.woff2') format('woff2'); }
  @page { size: A4 portrait; margin: 0; }
  :root { --tinta: #150f26; --menta: #1fc9aa; --brasa: #d9402a; --gris: #5b5570; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e9e6ef; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--tinta); }
  .hoja {
    width: 210mm; height: 297mm; margin: 12mm auto; background: #fff;
    padding: 18mm 18mm 16mm; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 6px 30px rgba(21, 15, 38, 0.18);
  }
  .cabecera { display: flex; align-items: flex-end; gap: 8mm; width: 100%; justify-content: center; }
  .corredor { width: 34mm; height: auto; flex: none; }
  h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 58mm; line-height: 0.82; letter-spacing: 0.01em; }
  h1::after { content: ''; display: block; height: 4.2mm; width: 62%; margin: 3mm 0 0 auto; background: var(--menta); transform: skewX(-24deg); border-radius: 1mm; }
  .bajada { font-size: 6.2mm; color: var(--gris); margin-top: 6mm; text-align: center; }
  .qr { width: 104mm; height: 104mm; margin-top: 11mm; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .escanea { font-family: 'Anton', Impact, sans-serif; font-size: 9.4mm; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 7mm; text-align: center; }
  .url { font-size: 5.4mm; color: var(--gris); margin-top: 2mm; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .controles { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin-top: 10mm; border-top: 0.4mm solid #ddd9e6; padding-top: 7mm; }
  .control { text-align: center; }
  .control + .control { border-left: 0.4mm dashed #c9c3d6; }
  .control b { display: block; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 8mm; letter-spacing: 0.08em; text-transform: uppercase; }
  .control span { font-size: 4.6mm; color: var(--gris); }
  .nota { font-size: 4.6mm; color: var(--gris); margin-top: 6mm; text-align: center; }
  .voto { margin-top: auto; font-family: 'Anton', Impact, sans-serif; font-size: 8.6mm; letter-spacing: 0.05em; text-transform: uppercase; color: var(--brasa); }
  .imprimir { position: fixed; top: 16px; right: 16px; font: 600 15px system-ui, sans-serif; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--tinta); color: #fff; cursor: pointer; }
  .imprimir:focus-visible { outline: 3px solid var(--menta); outline-offset: 2px; }
  /* Sólo en pantalla: la vista previa se achica para entrar entera. */
  @media screen and (max-width: 880px) { .hoja { zoom: 0.72; } }
  @media screen and (max-height: 1180px) and (min-width: 881px) { .hoja { zoom: 0.8; } }
  @media print {
    body { background: #fff; }
    .hoja { margin: 0; box-shadow: none; }
    .imprimir { display: none; }
  }
</style>
</head>
